<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito · CIRCUITO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<header>
<nav class="navbar navbar-expand-lg navbar-circuito sticky-top py-3">
  <div class="container">
    <a class="navbar-brand brand" href="catalogo.html"><span class="brand-mark">◆</span> CIRCUITO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link active" href="carrito.html">Carrito <span class="badge text-bg-secondary" id="badgeCarrito">0</span></a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="badge-rol">Cliente</span>
        <span class="text-muted" id="nombreUsuario" style="font-size:0.9rem;"></span>
        <button class="btn btn-sm btn-outline-accent" id="btnCerrarSesion">Cerrar sesión</button>
      </div>
    </div>
  </div>
</nav>
</header>

<main class="container py-4">
  <h2 class="mb-1">Tu carrito</h2>
  <p class="text-muted mb-4">Revisa tus productos antes de confirmar la compra.</p>

  <div id="carritoVacio" class="text-center py-5 d-none">
    <p class="text-muted mb-3">Tu carrito está vacío.</p>
    <a href="catalogo.html" class="btn btn-accent">Ir al catálogo</a>
  </div>

  <div id="carritoContenido" class="row g-4">
    <section class="col-lg-8" aria-label="Productos en el carrito">
      <div class="table-responsive">
        <table class="table table-circuito align-middle">
          <thead>
            <tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="tablaCarrito"></tbody>
        </table>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btnVaciarCarrito">Vaciar carrito</button>
    </section>

    <aside class="col-lg-4" aria-label="Resumen de compra">
      <div class="p-4" style="background-color: var(--ct-surface); border:1px solid var(--ct-border); border-radius:10px;">
        <h5 class="mb-3">Resumen</h5>
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Items</span>
          <span id="resumenItems">0</span>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <span class="text-muted">Total</span>
          <span class="precio fs-5" id="resumenTotal">$0</span>
        </div>
        <button class="btn btn-accent w-100" id="btnConfirmarCompra">Confirmar compra</button>
      </div>
    </aside>
  </div>
</main>

<footer class="footer-circuito py-4 mt-auto">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span><span class="brand-mark">◆</span> CIRCUITO — Tienda de tecnología</span>
    <span>Compra 100% simulada — proyecto académico</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/carrito.js"></script>
</body>
</html>
